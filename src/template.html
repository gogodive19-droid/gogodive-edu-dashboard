<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>고고다이브 강습 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap">
<style>
:root{
  --surface:#EDF2F5; --card:#FFFFFF; --card-2:#F5F8FA;
  --ink:#10283A; --ink-2:#48606F; --ink-3:#84979F;
  --line:#D8E1E7; --line-2:#EAF0F4;
  --water:#0F7BA3; --water-ink:#0B5C7A; --water-soft:#DCEDF4;
  --deep:#0A2F42; --deep-2:#0D3B52; --deep-line:#1E5068; --deep-ink:#EAF3F7; --deep-muted:#8FB0C0;
  --buoy:#D4611A; --buoy-soft:#FBE9DC;
  --sel-band:rgba(15,123,163,.10);
  --up:#8FD6A8; --down:#F4A89A;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"Chakra Petch","Pretendard Variable",Pretendard,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--buoy);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 12px}}

/* ── 상단: 짙은 바다색 계기판 ───────────────────────────── */
.top{background:var(--deep);color:var(--deep-ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding-top:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .buoy{width:12px;height:12px;border-radius:50%;background:var(--buoy);box-shadow:0 0 0 4px rgba(212,97,26,.22);flex:none}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand h1 small{display:block;font-size:11px;font-weight:500;color:var(--deep-muted);letter-spacing:.1em;margin-bottom:3px}
.meta{margin-left:auto;font-size:12px;color:var(--deep-muted)}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;margin-top:6px}
.tabs button{background:none;border:0;color:var(--deep-muted);padding:10px 14px;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--buoy)}

/* ── 조작 줄 ───────────────────────────────────────────── */
.controls{background:var(--card);border-bottom:1px solid var(--line)}
.controls .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding-top:10px;padding-bottom:10px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl-label{font-size:12px;color:var(--ink-3);margin-right:2px}
.ctl select,.ib,.chip{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px}
.ctl select{max-width:min(60vw,260px)}
.ib{width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--ink-2)}
.ib:hover,.chip:hover,.ctl select:hover{border-color:var(--water)}
.chip{border-radius:999px;padding:0 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--water-soft);border-color:var(--water);color:var(--water-ink)}
.tilde{color:var(--ink-3);padding:0 2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 12px;height:32px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff}

/* ── 계기판 숫자 ───────────────────────────────────────── */
.readout{background:var(--deep-2);color:var(--deep-ink);border-top:1px solid var(--deep-line)}
.readout .wrap{padding-top:16px;padding-bottom:18px}
.ro-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px}
.ro-head h2{margin:0;font-size:15px;font-weight:600}
.ro-head .period{font-family:var(--mono);font-size:13px;color:var(--deep-muted);letter-spacing:.04em}
.ro-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ro{background:rgba(255,255,255,.035);border:1px solid var(--deep-line);border-radius:10px;padding:10px 14px 8px;min-width:0}
.ro .lbl{font-size:11px;color:var(--deep-muted);letter-spacing:.06em}
.ro .val{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;letter-spacing:.01em;white-space:nowrap}
.ro .val small{font-family:var(--font);font-size:12px;font-weight:500;color:var(--deep-muted);margin-left:3px}
.ro .delta{font-size:11.5px;color:var(--deep-muted);margin-top:3px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro .delta.up{color:var(--up)} .ro .delta.down{color:var(--down)}
.ro .delta .vs{opacity:.7}
.ro-note{font-size:12px;color:var(--deep-muted);margin-top:10px}
@media (max-width:900px){.ro-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.ro-grid{grid-template-columns:repeat(2,1fr)} .ro .val{font-size:25px}}

/* ── 본문 ──────────────────────────────────────────────── */
main .wrap{padding-top:20px;padding-bottom:28px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700}
.card .sub{font-size:12.5px;color:var(--ink-3)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .c i{background:var(--water)} .legend .p i{background:var(--buoy)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);font-size:13px}
.muted{color:var(--ink-3)}

/* 월별 흐름 */
.trend-wrap{position:relative;min-height:120px}
.trend{display:block;width:100%;height:auto;overflow:visible}
.trend .ax{font-size:10.5px;fill:var(--ink-3)}
.trend .ax-title{font-size:11px;fill:var(--ink-2);font-weight:600}
.trend .yr{font-size:11px;fill:var(--ink);font-weight:700}
.trend .hit{fill:transparent;cursor:pointer}
.trend .hit:hover{fill:rgba(16,40,58,.06)}
.trend .lab{font-size:10.5px;fill:var(--ink);font-weight:600}

/* 가로 막대 목록 */
.bl{display:grid;gap:7px}
.bl-row{display:grid;grid-template-columns:minmax(84px,150px) 1fr 58px 70px 42px;align-items:center;gap:10px;font-size:13px;border-radius:6px}
.bl-row:not(.bl-head):hover{background:var(--card-2)}
.bl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-bars{display:grid;gap:3px}
.bl-bar{height:7px;border-radius:2px;min-width:2px}
.bl-bar.c{background:var(--water)} .bl-bar.p{background:var(--buoy)}
.bl-num{text-align:right}
.bl-num span{color:var(--ink-3);font-size:11px;margin-left:1px}
.bl-head{font-size:11px;color:var(--ink-3)}
@media (max-width:600px){.bl-row{grid-template-columns:minmax(70px,110px) 1fr 50px 62px 36px;gap:6px;font-size:12px}}

/* 표 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th{font-weight:600;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th[aria-sort=descending]::after{content:" ▾";color:var(--water)}
th[aria-sort=ascending]::after{content:" ▴";color:var(--water)}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--card-2)}
tr.total td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td.ratio{min-width:130px}
.ratio-bar{display:inline-block;height:6px;background:var(--water);border-radius:2px;vertical-align:middle;margin-right:6px}
/* 인원 구성 매트릭스 */
.mx th.h,.mx td.h{text-align:center;padding:6px 4px;min-width:40px}
.mx td.h.z{color:var(--ink-3)}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line-2)}
.mx tbody tr:hover td:first-child{background:var(--card-2)}
.mx td.tot{font-weight:700}

/* 툴팁 */
.tip{position:fixed;z-index:10;background:var(--deep);color:#fff;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;pointer-events:none;box-shadow:0 6px 20px rgba(10,47,66,.28);max-width:260px}
.tip b{display:block;margin-bottom:1px}
.tip .dim{color:var(--deep-muted)}

footer .wrap{padding-bottom:34px;font-size:12px;color:var(--ink-3);line-height:1.75}
footer b{color:var(--ink-2);font-weight:600}

@media (prefers-reduced-motion:no-preference){
  .bl-bar,.ratio-bar{transition:width .25s ease}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="buoy" aria-hidden="true"></span><h1><small>강습 현황 대시보드</small>고고다이브</h1></div>
  <div class="meta" id="dataMeta"></div>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button role="tab" data-tab="all" aria-selected="true">전체 현황</button>
    <button role="tab" data-tab="inst" aria-selected="false">강사별</button>
    <button role="tab" data-tab="cls" aria-selected="false">수업종류별</button>
    <button role="tab" data-tab="venue" aria-selected="false">강습장별</button>
  </nav>
</div></header>

<section class="controls"><div class="wrap">
  <div class="ctl" id="entWrap" hidden><span class="ctl-label" id="entLabel">강사</span><select id="selEntity" aria-label="항목 선택"></select></div>
  <div class="ctl"><span class="ctl-label">기간</span>
    <button class="ib" id="prevM" aria-label="이전 달">‹</button>
    <select id="selM" aria-label="월 선택"></select>
    <span id="rangeWrap" hidden><span class="tilde">~</span><select id="selTo" aria-label="끝 월"></select></span>
    <button class="ib" id="nextM" aria-label="다음 달">›</button>
    <button class="chip" id="rangeBtn" aria-pressed="false">기간으로 보기</button>
  </div>
  <div class="ctl"><span class="ctl-label">수업종류</span>
    <div class="seg" data-role="unit" role="group" aria-label="수업종류 단위"><button data-unit="big" aria-pressed="true">대분류</button><button data-unit="small" aria-pressed="false">세부</button></div>
  </div>
</div></section>

<section class="readout"><div class="wrap" id="readout"></div></section>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="tip" class="tip" hidden></div>

<script>
(function(){
'use strict';
const D = /*__DATA__*/;
const CAP = D.meta.sizeCap || 11;
const NM = D.months.length;
const LAST = D.months[NM-1];
const TABS = ['all','inst','cls','venue'];
const ENTITY_LABEL = {inst:'강사', cls:'수업종류', venue:'강습장'};

const state = {tab:'all', id:null, m:LAST, to:LAST, range:false, unit:'big', pct:false};
const sortState = {};
let lastSeries = null, resizeTimer = null;

// ── 도우미 ──────────────────────────────────────────────
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.prototype.slice.call((el||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const fmt1 = x => (Math.round(x*10)/10).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtPct = p => (p>=10 ? Math.round(p) : Math.round(p*10)/10) + '%';
const mLabel = m => { const y=m.slice(0,4), mo=+m.slice(5); return y+'년 '+mo+'월'; };
const clsName = ci => state.unit==='big' ? D.classes[ci].b : D.classes[ci].s;
const clsList = () => state.unit==='big' ? D.bigs.slice() : D.classes.map(c=>c.s);
const sizeLabel = i => i>=CAP ? CAP+'명+' : i+'명';
const KEY = { inst: c=>D.instructors[c[1]], cls: c=>clsName(c[2]), venue: c=>D.venues[c[3]] };

function period(){
  let a=D.months.indexOf(state.m), b=state.range ? D.months.indexOf(state.to) : a;
  if(a<0) a=NM-1; if(b<0) b=a; if(b<a){ const t=a; a=b; b=t; }
  return [a,b];
}
function periodLabel(){ const p=period(); return p[0]===p[1] ? mLabel(D.months[p[0]]) : mLabel(D.months[p[0]])+' ~ '+mLabel(D.months[p[1]])+' · '+(p[1]-p[0]+1)+'개월'; }
function baseList(kind){ return kind==='inst' ? D.instructors.slice() : kind==='cls' ? clsList() : D.venues.slice(); }

// ── 집계 ────────────────────────────────────────────────
function agg(){ const s=[]; for(let i=0;i<=CAP;i++) s.push(0); return {classes:0, people:0, zero:0, sizes:s}; }
function addTo(a,n,cnt){ if(n>0){ a.classes+=cnt; a.people+=n*cnt; a.sizes[Math.min(n,CAP)]+=cnt; } else a.zero+=cnt; }
function merge(t,a){ t.classes+=a.classes; t.people+=a.people; t.zero+=a.zero; for(let i=0;i<=CAP;i++) t.sizes[i]+=a.sizes[i]; return t; }
function rollup(pred, keyOf){
  const map=new Map();
  for(const c of D.cells){ if(!pred(c)) continue; const k=keyOf(c); let a=map.get(k); if(!a){ a=agg(); map.set(k,a); } addTo(a,c[4],c[5]); }
  return map;
}
function sumMap(map){ const t=agg(); map.forEach(a=>merge(t,a)); return t; }
const inRange = (a,b) => c => c[0]>=a && c[0]<=b;
const both = (f,g) => c => f(c) && g(c);
function entityPred(){ if(state.tab==='all') return function(){ return true; }; const k=KEY[state.tab]; return c => k(c)===state.id; }

function kpis(pred, a, b){
  const p = both(inRange(a,b), pred);
  const byInst = rollup(p, KEY.inst);
  const t = sumMap(byInst);
  const active = m => { let n=0; m.forEach(x=>{ if(x.classes>0) n++; }); return n; };
  t.nInst = active(byInst);
  t.nCls = active(rollup(p, KEY.cls));
  t.nVen = active(rollup(p, KEY.venue));
  t.avg = t.classes ? t.people/t.classes : 0;
  return t;
}
function trendSeries(pred){
  const s = D.months.map(()=>({classes:0, people:0, zero:0}));
  for(const c of D.cells){ if(!pred(c)) continue; const d=s[c[0]]; if(c[4]>0){ d.classes+=c[5]; d.people+=c[4]*c[5]; } else d.zero+=c[5]; }
  return s;
}

// ── URL 해시 ────────────────────────────────────────────
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if(TABS.indexOf(p.get('tab'))>=0) state.tab=p.get('tab');
  if(p.get('unit')==='small') state.unit='small';
  if(D.months.indexOf(p.get('m'))>=0) state.m=p.get('m');
  if(D.months.indexOf(p.get('to'))>=0){ state.to=p.get('to'); state.range = state.to!==state.m; } else state.to=state.m;
  if(p.get('id')) state.id=p.get('id');
  state.pct = p.get('pct')==='1';
}
function writeHash(){
  const p = new URLSearchParams();
  p.set('tab',state.tab); if(state.id && state.tab!=='all') p.set('id',state.id);
  p.set('m',state.m); if(state.range) p.set('to',state.to);
  if(state.unit!=='big') p.set('unit',state.unit); if(state.pct) p.set('pct','1');
  history.replaceState(null,'','#'+p.toString());
}

// ── 조각 ────────────────────────────────────────────────
function card(title, sub, body, right){
  return '<section class="card"><div class="card-head"><div><h3>'+title+'</h3>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(right||'')+'</div>'+body+'</section>';
}
function emptyMsg(){ return '<div class="empty">이 기간에 진행한 수업이 없습니다. 기간을 바꾸거나 다른 항목을 골라 보세요.</div>'; }
function pctSeg(){ return '<div class="seg" data-role="pct" role="group" aria-label="표시 단위"><button data-pct="0" aria-pressed="'+(!state.pct)+'">횟수</button><button data-pct="1" aria-pressed="'+state.pct+'">비율</button></div>'; }
function mxNote(){ return state.pct ? '각 칸은 그 줄 합계에서 차지하는 비율입니다. 색이 진할수록 횟수가 많습니다.' : '몇 명짜리 수업을 몇 번 했는지. 색이 진할수록 많습니다.'; }
function unitNote(){ return state.unit==='big' ? '대분류 기준 · 위쪽 "세부"를 누르면 강별로 나뉩니다' : '세부 수업 기준'; }

function delta(cur, prev, isRate, neutral){
  if(prev==null) return '<div class="delta">비교할 이전 기간 없음</div>';
  const d = cur-prev;
  if(Math.abs(d)<0.05) return '<div class="delta">이전 기간과 같음</div>';
  const cls = neutral ? '' : (d>0?'up':'down');
  const arrow = d>0?'▲':'▼';
  const body = isRate ? fmt1(Math.abs(d)) : fmt(Math.abs(d)) + (prev ? ' ('+fmtPct(Math.abs(d)/prev*100)+')' : '');
  return '<div class="delta '+cls+'">'+arrow+' '+body+' <span class="vs">이전 기간 대비</span></div>';
}
function readoutHTML(cur, prev){
  const title = state.tab==='all' ? '전체 강습 현황' : esc(state.id)+' <span class="muted">·</span> '+ENTITY_LABEL[state.tab]+' 현황';
  let items = [['수업 횟수','classes','회'], ['총 인원','people','명'], ['수업당 평균','avg','명',true]];
  if(state.tab==='inst') items = items.concat([['수업종류 수','nCls','종'],['강습장 수','nVen','곳']]);
  else if(state.tab==='cls') items = items.concat([['활동 강사','nInst','명'],['강습장 수','nVen','곳']]);
  else if(state.tab==='venue') items = items.concat([['활동 강사','nInst','명'],['수업종류 수','nCls','종']]);
  else items = items.concat([['활동 강사','nInst','명'],['0명 개설','zero','회',false,true]]);
  let h = '<div class="ro-head"><h2>'+title+'</h2><span class="period">'+periodLabel()+'</span></div><div class="ro-grid">';
  for(const it of items){
    const v = cur[it[1]], pv = prev ? prev[it[1]] : null;
    h += '<div class="ro"><div class="lbl">'+it[0]+'</div><div class="val">'+(it[3]?fmt1(v):fmt(v))+'<small>'+it[2]+'</small></div>'+delta(v,pv,it[3],it[4])+'</div>';
  }
  h += '</div>';
  h += '<div class="ro-note">'+(state.tab==='all'
    ? '개설했지만 0명이었던 수업과 프리다이빙 이론 LIVE는 횟수·인원에 넣지 않았습니다.'
    : '이 기간에 개설했지만 0명이었던 수업 '+fmt(cur.zero)+'회는 횟수·인원에 넣지 않았습니다.')+'</div>';
  return h;
}

function barList(map){
  const rows=[]; map.forEach((a,k)=>{ if(a.classes>0) rows.push([k,a]); });
  rows.sort((x,y)=>y[1].classes-x[1].classes);
  if(!rows.length) return emptyMsg();
  const maxC=rows[0][1].classes; let maxP=0; rows.forEach(r=>{ if(r[1].people>maxP) maxP=r[1].people; });
  let h='<div class="bl"><div class="bl-row bl-head"><div></div><div></div><div class="bl-num">횟수</div><div class="bl-num">인원</div><div class="bl-num">평균</div></div>';
  for(const r of rows){ const k=r[0], a=r[1];
    h+='<div class="bl-row" data-tip="'+esc(k)+' · 수업 '+fmt(a.classes)+'회 · 인원 '+fmt(a.people)+'명 · 평균 '+fmt1(a.people/a.classes)+'명">'
      +'<div class="bl-name">'+esc(k)+'</div>'
      +'<div class="bl-bars"><div class="bl-bar c" style="width:'+(a.classes/maxC*100)+'%"></div><div class="bl-bar p" style="width:'+(maxP?a.people/maxP*100:0)+'%"></div></div>'
      +'<div class="bl-num">'+fmt(a.classes)+'<span>회</span></div><div class="bl-num">'+fmt(a.people)+'<span>명</span></div><div class="bl-num muted">'+fmt1(a.people/a.classes)+'</div></div>';
  }
  return h+'</div>';
}

function statTable(map, id, colLabel){
  const rows=[]; map.forEach((a,k)=>{ if(a.classes>0) rows.push({k:k, classes:a.classes, people:a.people, avg:a.people/a.classes}); });
  if(!rows.length) return emptyMsg();
  const tot={classes:0,people:0}; rows.forEach(r=>{ tot.classes+=r.classes; tot.people+=r.people; });
  const st = sortState[id] || (sortState[id]={key:'classes',dir:-1});
  rows.sort((x,y)=> st.key==='k' ? st.dir*x.k.localeCompare(y.k,'ko') : st.dir*(x[st.key]-y[st.key]) || y.classes-x.classes);
  const th=(key,label)=>'<th class="sortable" data-table="'+id+'" data-key="'+key+'"'+(st.key===key?' aria-sort="'+(st.dir<0?'descending':'ascending')+'"':'')+'>'+label+'</th>';
  let h='<div class="tbl-wrap"><table><thead><tr>'+th('k',colLabel)+th('classes','횟수')+'<th>비율</th>'+th('people','인원')+th('avg','평균')+'</tr></thead><tbody>';
  for(const r of rows){ const p=r.classes/tot.classes*100;
    h+='<tr><td>'+esc(r.k)+'</td><td>'+fmt(r.classes)+'</td><td class="ratio"><span class="ratio-bar" style="width:'+Math.max(2,p*0.9)+'px"></span>'+fmtPct(p)+'</td><td>'+fmt(r.people)+'</td><td class="muted">'+fmt1(r.avg)+'</td></tr>';
  }
  h+='</tbody><tfoot><tr class="total"><td>합계</td><td>'+fmt(tot.classes)+'</td><td>100%</td><td>'+fmt(tot.people)+'</td><td>'+fmt1(tot.people/tot.classes)+'</td></tr></tfoot></table></div>';
  return h;
}

function matrix(map, rowLabel){
  const rows=[]; map.forEach((a,k)=>{ if(a.classes>0) rows.push([k,a]); });
  rows.sort((x,y)=>y[1].classes-x[1].classes);
  if(!rows.length) return emptyMsg();
  const tot=agg(); rows.forEach(r=>merge(tot,r[1]));
  let maxCell=1; rows.forEach(r=>{ for(let i=1;i<=CAP;i++) if(r[1].sizes[i]>maxCell) maxCell=r[1].sizes[i]; });
  let h='<div class="tbl-wrap"><table class="mx"><thead><tr><th>'+rowLabel+'</th>';
  for(let i=1;i<=CAP;i++) h+='<th class="h">'+sizeLabel(i)+'</th>';
  h+='<th>합계</th><th>전체 대비</th></tr></thead><tbody>';
  for(const r of rows){ const k=r[0], a=r[1];
    h+='<tr><td>'+esc(k)+'</td>';
    for(let i=1;i<=CAP;i++){ const v=a.sizes[i];
      if(!v){ h+='<td class="h z">·</td>'; continue; }
      const t=v/maxCell, rp=v/a.classes*100;
      h+='<td class="h" style="background:rgba(15,123,163,'+(0.07+0.48*t).toFixed(2)+')" data-tip="'+esc(k)+' · '+sizeLabel(i)+' 수업 '+fmt(v)+'회 · 이 줄의 '+fmtPct(rp)+'">'+(state.pct?fmtPct(rp):fmt(v))+'</td>';
    }
    h+='<td class="tot">'+fmt(a.classes)+'</td><td class="muted">'+fmtPct(a.classes/tot.classes*100)+'</td></tr>';
  }
  h+='</tbody><tfoot><tr class="total"><td>합계</td>';
  for(let i=1;i<=CAP;i++){ const v=tot.sizes[i]; h+='<td class="h">'+(v ? (state.pct?fmtPct(v/tot.classes*100):fmt(v)) : '·')+'</td>'; }
  h+='<td>'+fmt(tot.classes)+'</td><td>100%</td></tr></tfoot></table></div>';
  return h;
}

// ── 월별 흐름 차트 (SVG) ─────────────────────────────────
function drawTrend(series){
  const el=$('#trend'); if(!el || !series) return;
  const W=Math.max(320, el.clientWidth||600);
  const padL=44, padR=10, top=22, h1=108, gap=42, h2=78, bottom=30;
  const H=top+h1+gap+h2+bottom;
  const n=series.length, innerW=W-padL-padR, step=innerW/n, bw=Math.max(2, Math.min(18, step*0.62));
  const p=period(), a=p[0], b=p[1];
  const nice=v=>{ if(v<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; };
  let mc=1, mp=1; series.forEach(s=>{ if(s.classes>mc) mc=s.classes; if(s.people>mp) mp=s.people; });
  const maxC=nice(mc), maxP=nice(mp);
  const base1=top+h1, base2=top+h1+gap+h2;
  const yC=v=>base1-v/maxC*h1, yP=v=>base2-v/maxP*h2;
  let s='<svg class="trend" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="월별 수업 횟수와 인원">';
  s+='<rect x="'+(padL+a*step)+'" y="'+(top-8)+'" width="'+((b-a+1)*step)+'" height="'+(base2-top+8)+'" rx="4" fill="var(--sel-band)"/>';
  [[yC,maxC,'수업 횟수',base1,top],[yP,maxP,'인원',base2,top+h1+gap]].forEach(pn=>{
    const y=pn[0], max=pn[1];
    [0.5,1].forEach(f=>{ const yy=y(max*f); s+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line-2)"/><text x="'+(padL-6)+'" y="'+(yy+3.5)+'" text-anchor="end" class="ax">'+fmt(max*f)+'</text>'; });
    s+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+pn[3]+'" y2="'+pn[3]+'" stroke="var(--line)"/>';
    s+='<text x="'+padL+'" y="'+(pn[4]-8)+'" class="ax-title">'+pn[2]+'</text>';
  });
  series.forEach((d,i)=>{
    const x=padL+i*step+(step-bw)/2, sel=i>=a&&i<=b, op=sel?1:0.42;
    const y1=yC(d.classes), y2=yP(d.people);
    if(d.classes>0) s+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+(base1-y1)+'" rx="2" fill="var(--water)" opacity="'+op+'"/>';
    if(d.people>0) s+='<rect x="'+x+'" y="'+y2+'" width="'+bw+'" height="'+(base2-y2)+'" rx="2" fill="var(--buoy)" opacity="'+op+'"/>';
    if(sel && a===b && step>=14){ s+='<text x="'+(x+bw/2)+'" y="'+(y1-4)+'" text-anchor="middle" class="lab">'+fmt(d.classes)+'</text><text x="'+(x+bw/2)+'" y="'+(y2-4)+'" text-anchor="middle" class="lab">'+fmt(d.people)+'</text>'; }
  });
  series.forEach((d,i)=>{
    const m=D.months[i], mo=+m.slice(5), xc=padL+i*step+step/2;
    if(mo===1 || i===0) s+='<text x="'+(padL+i*step+2)+'" y="'+(H-10)+'" class="yr">'+m.slice(0,4)+'</text>';
    else if(step>=22 && (mo-1)%3===0) s+='<text x="'+xc+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+mo+'월</text>';
  });
  series.forEach((d,i)=>{ s+='<rect class="hit" data-i="'+i+'" x="'+(padL+i*step)+'" y="'+(top-8)+'" width="'+step+'" height="'+(base2-top+8)+'"/>'; });
  s+='</svg>';
  el.innerHTML=s;
  const svg=el.firstElementChild;
  svg.addEventListener('mousemove', e=>{
    const t=e.target.closest('.hit'); if(!t){ hideTip(); return; }
    const i=+t.getAttribute('data-i'), d=series[i];
    showTip(e, '<b>'+mLabel(D.months[i])+'</b>수업 '+fmt(d.classes)+'회 · 인원 '+fmt(d.people)+'명'+(d.classes?' · 평균 '+fmt1(d.people/d.classes)+'명':'')+(d.zero?'<br><span class="dim">0명 개설 '+fmt(d.zero)+'회</span>':'')+'<br><span class="dim">누르면 이 달로 이동</span>');
  });
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('click', e=>{ const t=e.target.closest('.hit'); if(!t) return; const m=D.months[+t.getAttribute('data-i')]; state.m=m; state.to=m; state.range=false; update(); });
}
function trendCard(title, sub){
  return '<section class="card"><div class="card-head"><div><h3>'+title+'</h3><div class="sub">'+sub+'</div></div><div class="legend"><span class="c"><i></i>수업 횟수</span><span class="p"><i></i>인원</span></div></div><div class="trend-wrap" id="trend"></div></section>';
}

// ── 툴팁 ────────────────────────────────────────────────
const tip=$('#tip');
function showTip(e, html){
  tip.innerHTML=html; tip.hidden=false;
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad; const r=tip.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-pad;
  if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-pad;
  tip.style.left=Math.max(4,x)+'px'; tip.style.top=Math.max(4,y)+'px';
}
function hideTip(){ tip.hidden=true; }
document.addEventListener('mousemove', e=>{
  const t=e.target.closest ? e.target.closest('[data-tip]') : null;
  if(t) showTip(e, esc(t.getAttribute('data-tip')));
  else if(!(e.target.closest && e.target.closest('.trend'))) hideTip();
});

// ── 선택 목록 ───────────────────────────────────────────
function entityOptionsHTML(){
  const p=period(), kind=state.tab, counts=rollup(inRange(p[0],p[1]), KEY[kind]);
  const base=baseList(kind), order={}; base.forEach((k,i)=>order[k]=i);
  const list=base.map(k=>[k, counts.get(k)?counts.get(k).classes:0]);
  list.sort((x,y)=> y[1]-x[1] || order[x[0]]-order[y[0]]);
  if(!state.id || !list.some(x=>x[0]===state.id)) state.id=list[0][0];
  return list.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===state.id?' selected':'')+'>'+esc(x[0])+' · '+fmt(x[1])+'회</option>').join('');
}
function setUnit(u){
  if(u===state.unit) return;
  if(state.tab==='cls' && state.id){
    if(u==='big'){ const c=D.classes.filter(x=>x.s===state.id)[0]; state.id=c?c.b:null; }
    else { const p=period(), counts=rollup(inRange(p[0],p[1]), c=>D.classes[c[2]].s);
      const smalls=D.classes.filter(x=>x.b===state.id).map(x=>x.s);
      smalls.sort((q,r)=>((counts.get(r)||{}).classes||0)-((counts.get(q)||{}).classes||0));
      state.id=smalls[0]||null; }
  }
  state.unit=u; update();
}

// ── 화면 ────────────────────────────────────────────────
function render(){
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.getAttribute('data-tab')===state.tab)));
  const entWrap=$('#entWrap');
  if(state.tab==='all'){ entWrap.hidden=true; }
  else { entWrap.hidden=false; $('#entLabel').textContent=ENTITY_LABEL[state.tab]; $('#selEntity').innerHTML=entityOptionsHTML(); }
  $('#selM').value=state.m; $('#selTo').value=state.to; $('#rangeWrap').hidden=!state.range;
  $('#rangeBtn').setAttribute('aria-pressed', String(state.range));
  $$('.seg[data-role=unit] button').forEach(b=>b.setAttribute('aria-pressed', String(b.getAttribute('data-unit')===state.unit)));

  const p=period(), a=p[0], b=p[1], len=b-a+1, pred=entityPred();
  const cur=kpis(pred,a,b), prev=(a-len>=0)?kpis(pred,a-len,a-1):null;
  $('#readout').innerHTML=readoutHTML(cur,prev);
  const inP=both(inRange(a,b),pred);
  lastSeries=trendSeries(pred);
  let html='';
  if(state.tab==='all'){
    html+=trendCard('월별 흐름', mLabel(D.months[0])+'부터 매달 진행한 수업 횟수와 인원. 막대를 누르면 그 달로 이동합니다.');
    const lg='<div class="legend"><span class="c"><i></i>수업 횟수</span><span class="p"><i></i>인원</span></div>';
    html+='<div class="two">'+card('수업종류별', unitNote(), barList(rollup(inP, KEY.cls)), lg)+card('강습장별', '진행한 수업이 있는 곳만', barList(rollup(inP, KEY.venue)), lg)+'</div>';
  } else {
    const ks = state.tab==='inst' ? ['cls','venue'] : state.tab==='cls' ? ['inst','venue'] : ['inst','cls'];
    const L1=ENTITY_LABEL[ks[0]], L2=ENTITY_LABEL[ks[1]];
    html+=trendCard(esc(state.id)+' · 월별 흐름', '전체 기간의 매달 수업 횟수와 인원. 막대를 누르면 그 달로 이동합니다.');
    const m1=rollup(inP, KEY[ks[0]]), m2=rollup(inP, KEY[ks[1]]);
    html+='<div class="two">'
      +card(L1+'별 횟수와 인원', ks[0]==='cls'?unitNote():'', statTable(m1,'t1',L1))
      +card(L2+'별 횟수와 인원', ks[1]==='cls'?unitNote():'', statTable(m2,'t2',L2))+'</div>';
    html+=card(L1+'별 인원 구성', mxNote(), matrix(m1,L1), pctSeg());
    html+=card(L2+'별 인원 구성', mxNote(), matrix(m2,L2), pctSeg());
  }
  $('#view').innerHTML=html;
  drawTrend(lastSeries);
  hideTip();
}
function update(){ writeHash(); render(); }

// ── 시작 ────────────────────────────────────────────────
function init(){
  const opts=D.months.map(m=>'<option value="'+m+'">'+mLabel(m)+'</option>').join('');
  $('#selM').innerHTML=opts; $('#selTo').innerHTML=opts;
  $('#dataMeta').textContent='데이터 '+mLabel(D.meta.lastMonth)+'까지 · '+D.meta.builtAt+' 갱신';
  $('#foot').innerHTML='<b>숫자 읽는 법</b> — 인원은 출석 기준이며 결석은 뺐습니다. 개설했지만 0명이었던 수업은 횟수·인원에 넣지 않았습니다. 같은 시각·강사·수업명이 두 줄로 있으면 인원이 적은 한 줄만 셌습니다. 프리다이빙 이론 LIVE는 뺐습니다. '+CAP+'명 이상은 한 칸으로 묶었습니다.<br>원본: 예약 시스템 통계분석(그룹수업) 엑셀 · '+mLabel(D.meta.firstMonth)+' ~ '+mLabel(D.meta.lastMonth)+' · 수업 '+fmt(D.meta.records)+'건';
  readHash();

  $('.tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; const t=b.getAttribute('data-tab'); if(t!==state.tab){ state.tab=t; state.id=null; update(); } });
  $('#selEntity').addEventListener('change', e=>{ state.id=e.target.value; update(); });
  $('#selM').addEventListener('change', e=>{ state.m=e.target.value; if(!state.range || D.months.indexOf(state.to)<D.months.indexOf(state.m)) state.to=state.m; update(); });
  $('#selTo').addEventListener('change', e=>{ state.to=e.target.value; if(D.months.indexOf(state.to)<D.months.indexOf(state.m)){ const t=state.m; state.m=state.to; state.to=t; } update(); });
  const shift=d=>{ const p=period(), na=p[0]+d, nb=p[1]+d; if(na<0||nb>NM-1) return; state.m=D.months[na]; state.to=D.months[nb]; update(); };
  $('#prevM').addEventListener('click', ()=>shift(-1));
  $('#nextM').addEventListener('click', ()=>shift(1));
  $('#rangeBtn').addEventListener('click', ()=>{
    state.range=!state.range;
    if(state.range){ const p=period(); if(p[0]===p[1]){ state.m=D.months[Math.max(0,p[0]-2)]; state.to=D.months[p[0]]; } }
    else state.to=state.m;
    update();
  });
  document.addEventListener('click', e=>{
    const u=e.target.closest('.seg[data-role=unit] button'); if(u){ setUnit(u.getAttribute('data-unit')); return; }
    const pc=e.target.closest('.seg[data-role=pct] button'); if(pc){ state.pct=pc.getAttribute('data-pct')==='1'; update(); return; }
    const th=e.target.closest('th.sortable'); if(th){ const id=th.getAttribute('data-table'), key=th.getAttribute('data-key'); const st=sortState[id]||(sortState[id]={key:'classes',dir:-1}); if(st.key===key) st.dir=-st.dir; else { st.key=key; st.dir=key==='k'?1:-1; } render(); }
  });
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>drawTrend(lastSeries),120); });
  window.addEventListener('hashchange', ()=>{ readHash(); render(); });
  render();
}
init();
})();
</script>
